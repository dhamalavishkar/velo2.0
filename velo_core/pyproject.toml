[project]
name = "velo_core"
version = "0.1.0"
description = "VELO 2.0 Backend - Local AI Assistant Orchestrator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.1",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "ollama>=0.4.0",
    "faster-whisper>=1.1.0",
    "sounddevice>=0.4.7",
    "pvporcupine>=3.0.0",
    "numpy>=1.26.0",
    "playwright>=1.48.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "pywin32>=308",
]

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]